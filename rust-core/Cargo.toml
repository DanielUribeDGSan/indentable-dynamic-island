[package]
name = "dynamic-island-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "dynamic_island_core"
crate-type = ["staticlib"]

[dependencies]
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"

[profile.release]
lto = false
codegen-units = 16
